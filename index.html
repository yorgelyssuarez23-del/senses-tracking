<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senses Tracking – Rastreo de Pedido 💖</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            border: 2px solid #f8bbd0;
        }
        h1 {
            color: #d81b60;
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: #d81b60;
            box-shadow: 0 0 8px rgba(216, 27, 96, 0.2);
        }
        button {
            background: linear-gradient(45deg, #ec407a, #d81b60);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .card {
            background: #fff5f8;
            border-radius: 15px;
            padding: 18px;
            border: 1px solid #f8bbd0;
            display: none;
        }
        .client-info {
            font-weight: bold;
            color: #ad1457;
            font-size: 15px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #f48fb1;
            padding-bottom: 8px;
        }
        .delivery-info {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .timeline {
            position: relative;
            padding-left: 20px;
            margin-top: 15px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background: #f8bbd0;
        }
        .step {
            position: relative;
            margin-bottom: 15px;
            font-size: 13px;
            color: #aaa;
        }
        .step.active {
            color: #d81b60;
            font-weight: bold;
        }
        .step.completed {
            color: #43a047;
        }
        .step::before {
            content: '●';
            position: absolute;
            left: -19px;
            top: -1px;
            font-size: 12px;
            background: white;
        }
        .step.active::before {
            content: '💖';
            left: -23px;
            top: -2px;
            font-size: 11px;
        }
        .step.completed::before {
            content: '✓';
            left: -21px;
            color: #43a047;
            font-weight: bold;
        }
        .step-date {
            font-size: 11px;
            color: #888;
            font-weight: normal;
            margin-top: 2px;
        }
        .error-msg {
            color: #e53935;
            text-align: center;
            font-weight: bold;
            background: #ffebee;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Senses Tracking ✨</h1>
    <p class="subtitle">Sigue el viaje de tus favoritos en tiempo real 🛍️✨</p>

    <div class="search-box">
        <input type="text" id="inputGuia" placeholder="Ej: SNS-020" onkeypress="if(event.key==='Enter') buscarGuia()">
        <button onclick="buscarGuia()">Buscar 💖</button>
    </div>

    <div id="errorMsg" class="error-msg">Número de guía no encontrado ❌</div>

    <div id="cardResultado" class="card">
        <div id="clienteNombre" class="client-info"></div>
        <div class="delivery-info">
            📅 <b>Entrega estimada:</b> <span id="entregaFecha"></span><br>
            ⏱️ <b>Tiempo:</b> <span id="entregaDias"></span>
        </div>
        <div class="timeline" id="timelinePasos"></div>
    </div>
</div>

            pasoActual: 1,

        }

    const listaPasos = [
        "📦 Pedido confirmado ✨",
        "📦 Preparando pedido 🎀",
        "📦 Empacado 🎁",
        "🚚 Recogido por transportadora 🚛",
        "✈️ Salió de origen 🛫",
        "🛬 Llegó a país de destino 🇨🇴",
        "🛃 En proceso aduanal 📋",
        "📦 En centro de distribución local 🚚",
        "🛵 En camino a tu dirección 🏠",
        "🎉 Pedido entregado ✨"
    ];

    function buscarGuia() {
        const input = document.getElementById("inputGuia").value.trim().toUpperCase();
        const card = document.getElementById("cardResultado");
        const error = document.getElementById("errorMsg");

        card.style.display = "none";
        error.style.display = "none";

        if (!input || !datosRastreo[input]) {
            error.style.display = "block";
            return;
        }

        const datos = datosRastreo[input];
        document.getElementById("clienteNombre").innerText = datos.cliente;
        document.getElementById("entregaFecha").innerText = datos.entregaFecha;
        document.getElementById("entregaDias").innerText = datos.entregaDias;

        const timeline = document.getElementById("timelinePasos");
        timeline.innerHTML = "";

        listaPasos.forEach((pasoText, index) => {
            const stepDiv = document.createElement("div");
            stepDiv.className = "step";

            if (index < datos.pasoActual) {
                stepDiv.classList.add("completed");
            } else if (index === datos.pasoActual) {
                stepDiv.classList.add("active");
            }

            let htmlContent = `<div>${pasoText}</div>`;
            if (datos.fechas && datos.fechas[index]) {
                htmlContent += `<div class="step-date">${datos.fechas[index]}</div>`;
            }

            stepDiv.innerHTML = htmlContent;
            timeline.appendChild(stepDiv);
        });

        card.style.display = "block";
    }
</script>

</body>
</html>
