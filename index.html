<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senses Tracking</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            padding: 12px 18px;
            background-color: #9333ea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* BANNER DE ENTREGA MORADO ESTILO SHEIN */
        .delivery-banner {
            margin-top: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }
        .delivery-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .delivery-icon {
            font-size: 20px;
        }
        .delivery-date {
            color: #9333ea; /* Color morado para destacar la fecha */
            font-weight: 700;
        }
        .delivery-subtext {
            margin-top: 4px;
            font-size: 13px;
            color: #64748b;
            padding-left: 28px;
        }

        .cliente-info {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
        }
        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #f1f5f9;
            margin-top: 15px;
        }
        .step {
            margin-bottom: 18px;
            position: relative;
            opacity: 0.35;
        }
        .step.active {
            opacity: 1;
        }
        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
        }
        .step-date {
            font-size: 11px;
            color: #94a3b8;
        }
        .error {
            color: #ef4444;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Rastreo de Pedido 📦</h2>
    <div class="search-box">
        <input type="text" id="guiaInput" placeholder="Ingresa tu número de guía">
        <button onclick="buscarRastreo()">Buscar</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    const datosRastreo = {
        "SNS-004": {
            cliente: "Cliente: Julia duran",
            entregaFecha: "08/15 - 08/20",
            entregaDias: "8-16 Días Laborables",
            pasoActual: 1,
            fechas: {
                0: "28 Jul - 10:00 AM",
                1: "29 Jul - 8:00 AM"
            }
        }
    };

    // TUS 12 PASOS ORIGINALES EXACTOS
    const listaPasos = [
        "📦 Pedido confirmado",
        "📦 Preparando pedido",
        "📦 Empacado",
        "🚚 Recogido por transportadora",
        "✈️ Salió de origen",
        "✈️ Llegó al aeropuerto",
        "🛂 En proceso de aduana",
        "🇨🇴 Llegó a Colombia",
        "🚚 Llegó a Medellín",
        "🚚 En camino a senses store",
        "🏫 Recibido en Senses store",
        "📦 Entregado a MRW Venezuela"
    ];

    function buscarRastreo() {
        const guia = document.getElementById("guiaInput").value.trim().toUpperCase();
        const contenedor = document.getElementById("resultado");
        contenedor.innerHTML = "";

        if (!datosRastreo[guia]) {
            contenedor.innerHTML = `<p class="error">Número de guía no encontrado.</p>`;
            return;
        }

        const info = datosRastreo[guia];

        let html = `
            <div class="cliente-info">${info.cliente}</div>
            
            ${info.entregaFecha ? `
                <div class="delivery-banner">
                    <div class="delivery-header">
                        <span class="delivery-icon">🚚</span>
                        <span>Entrega</span>
                        <span class="delivery-date">${info.entregaFecha}</span>
                    </div>
                    ${info.entregaDias ? `<div class="delivery-subtext">${info.entregaDias}</div>` : ''}
                </div>
            ` : ''}

            <div class="timeline">
        `;

        listaPasos.forEach((paso, index) => {
            const esActivo = index <= info.pasoActual;
            const fecha = info.fechas && info.fechas[index] ? info.fechas[index] : "";

            html += `
                <div class="step ${esActivo ? 'active' : ''}">
                    <div class="step-title">${paso}</div>
                    ${fecha ? `<div class="step-date">${fecha}</div>` : ''}
                </div>
            `;
        });

        html += `</div>`;
        contenedor.innerHTML = html;
    }
</script>

</body>
</html>
