<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senses Tracking - Rastreo de Pedido 💖</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #fae8ff 100%);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.12);
            max-width: 420px;
            width: 100%;
            border: 2px solid #f472b6;
        }

        /* BRANDING HEADER */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #d946ef, #9333ea, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .brand-subtitle {
            font-size: 13px;
            color: #a21caf;
            font-weight: 600;
            margin-top: 6px;
        }

        .search-title {
            text-align: center;
            color: #7e22ce;
            margin-bottom: 14px;
            font-size: 16px;
            font-weight: 700;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #fbcfe8;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background-color: #fff5f8;
            color: #475569;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #d946ef;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.15);
        }
        button {
            padding: 12px 18px;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: scale(1.03);
        }

        /* BANNER DE ENTREGA */
        .delivery-banner {
            margin-top: 15px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #fbcfe8;
            padding: 14px;
            background: #faf5ff;
            border-radius: 14px;
        }
        .delivery-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #6b21a8;
        }
        .delivery-icon {
            font-size: 20px;
        }
        .delivery-date {
            color: #ec4899;
            font-weight: 800;
        }
        .delivery-subtext {
            margin-top: 4px;
            font-size: 12px;
            color: #a21caf;
            padding-left: 28px;
            font-weight: 500;
        }

        .cliente-info {
            font-size: 14px;
            font-weight: 700;
            color: #9333ea;
            margin-bottom: 12px;
            background: #fdf4ff;
            padding: 8px 12px;
            border-radius: 10px;
            display: inline-block;
            border-left: 4px solid #d946ef;
        }
        .timeline {
            position: relative;
            padding-left: 25px;
            border-left: 3px solid #fbcfe8;
            margin-top: 15px;
        }
        .step {
            margin-bottom: 18px;
            position: relative;
            opacity: 0.35;
        }
        .step.active {
            opacity: 1;
        }
        .step-icon {
            position: absolute;
            left: -33px;
            top: 0;
            font-size: 14px;
            background: white;
            border-radius: 50%;
        }
        .step.active .step-icon {
            color: #d946ef;
        }
        .step.completed .step-icon {
            color: #22c55e;
        }
        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
        .step.active .step-title {
            color: #7e22ce;
            font-weight: 700;
        }
        .step-date {
            font-size: 11px;
            color: #c084fc;
            font-weight: 600;
        }
        .error {
            color: #ef4444;
            text-align: center;
            font-weight: 600;
            background: #fef2f2;
            padding: 10px;
            border-radius: 10px;
        }

        /* BOTON WHATSAPP */
        .whatsapp-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #fbcfe8;
            text-align: center;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease;
        }
        .whatsapp-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>

    const listaPasos = [
        "📦 Pedido confirmado ✨",
        "📦 Preparando pedido 🎀",
        "📦 Empacado 🎁",
        "🚚 Recogido por transportadora 🚛",

        "🚚 Llegó a Medellín 🏙️",
        "🚚 En camino a senses store 🛍️",
        "🏫 Recibido en Senses store 🏢",
        "📦 Entregado a MRW Venezuela 🇻🇪"
    ];

    function buscarRastreo() {
        const guia = document.getElementById("guiaInput").value.trim().toUpperCase();
        const contenedor = document.getElementById("resultado");
        contenedor.innerHTML = "";

        if (!datosRastreo[guia]) {
            contenedor.innerHTML = `<p class="error">Número de guía no encontrado ❌</p>`;
            return;
        }

        const info = datosRastreo[guia];

        let html = `
            <div class="cliente-info">👤 ${info.cliente}</div>
            
            ${info.entregaFecha ? `
                <div class="delivery-banner">
                    <div class="delivery-header">
                        <span class="delivery-icon">🚚</span>
                        <span>Entrega estimada:</span>
                        <span class="delivery-date">${info.entregaFecha}</span>
                    </div>
                    ${info.entregaDias ? `<div class="delivery-subtext">⏳ ${info.entregaDias}</div>` : ''}
                </div>
            ` : ''}

            <div class="timeline">
        `;

        listaPasos.forEach((paso, index) => {
            const esCompletado = index < info.pasoActual;
            const esActivo = index === info.pasoActual;
            const fecha = info.fechas && info.fechas[index] ? info.fechas[index] : "";

            let estadoClass = "";
            let icono = `<i class="fa-solid fa-circle" style="font-size: 8px; color: #f472b6;"></i>`;

            if (esCompletado) {
                estadoClass = "active completed";
                icono = `<i class="fa-solid fa-circle-check"></i>`;
            } else if (esActivo) {
                estadoClass = "active";
                icono = `<i class="fa-solid fa-truck-fast"></i>`;
            }

            html += `
                <div class="step ${estadoClass}">
                    <div class="step-icon">${icono}</div>
                    <div class="step-title">${paso}</div>
                    ${fecha ? `<div class="step-date">🕒 ${fecha}</div>` : ''}
                </div>
            `;
        });

        const waMsg = encodeURIComponent(`Hola Senses 💖, quiero consultar sobre mi pedido guía ${guia}.`);
        const numeroWhatsApp = "573016878177";

        html += `
            </div>
            <div class="whatsapp-box">
                <a href="https://wa.me/${numeroWhatsApp}?text=${waMsg}" target="_blank" class="whatsapp-btn">
                    <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i>
                    ¿Tienes dudas? Escríbenos a WhatsApp 💬
                </a>
            </div>
        `;

        contenedor.innerHTML = html;
    }
